[project]
name = "ssb-yr"
version = "0.1.0"
description = "Weather forecast fetcher — registers locations and fetches forecasts from Yr.no (api.met.no)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.9",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true
strict = true


